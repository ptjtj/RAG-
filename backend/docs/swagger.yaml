basePath: /api/v1
definitions:
  controllers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  controllers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  controllers.RegisterRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: new_user
        type: string
    required:
    - password
    - username
    type: object
  controllers.UpdatePasswordRequest:
    properties:
      newPassword:
        example: "654321"
        type: string
      oldPassword:
        example: "123456"
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  controllers.UpdateUsernameRequest:
    properties:
      newUsername:
        example: super_admin
        type: string
    required:
    - newUsername
    type: object
  models.CreateKBRequest:
    properties:
      chunkSize:
        type: integer
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  models.KnowledgeBase:
    properties:
      chunkSize:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      docCount:
        type: integer
      id:
        type: integer
      name:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  models.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 这是基于 Gin 和 OpenAPI 构建的 AI-KMS 后端服务。
  title: AI 知识库管理平台 API
  version: "1.0"
paths:
  /docs/{doc_id}:
    delete:
      description: 删除文档记录、关联的切片数据以及本地物理文件
      operationId: deleteDocument
      parameters:
      - description: 文档 ID
        in: path
        name: doc_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: 删除文档
      tags:
      - Document
  /kb:
    get:
      consumes:
      - application/json
      description: 从数据库获取所有未被删除的知识库
      operationId: getKnowledgeBases
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.KnowledgeBase'
                  type: array
              type: object
      summary: 获取知识库列表
      tags:
      - KnowledgeBase
    post:
      consumes:
      - application/json
      description: 接收前端参数并在数据库中创建新记录
      operationId: creatKnowledgeBase
      parameters:
      - description: 请求参数
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/models.CreateKBRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.KnowledgeBase'
              type: object
      summary: 创建新知识库
      tags:
      - KnowledgeBase
  /kb/{id}:
    delete:
      consumes:
      - application/json
      description: 根据 ID 软删除知识库记录
      operationId: deleteKnowledgeBase
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      summary: 删除知识库
      tags:
      - KnowledgeBase
  /login:
    post:
      consumes:
      - application/json
      description: 用户输入账号和密码进行登录，成功后返回短令牌 (accessToken) 和长令牌 (refreshToken)
      parameters:
      - description: 登录账号和密码
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: 账号或密码错误
          schema:
            $ref: '#/definitions/models.Response'
      summary: 用户登录
      tags:
      - 认证 (Auth)
  /refresh:
    post:
      consumes:
      - application/json
      description: 使用长令牌换取新的短令牌
      parameters:
      - description: 刷新参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/controllers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      summary: 刷新 Access Token
      tags:
      - 认证 (Auth)
  /register:
    post:
      consumes:
      - application/json
      description: 管理员在后台添加新用户
      parameters:
      - description: 注册参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/controllers.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      summary: 注册新用户 (添加用户)
      tags:
      - 认证 (Auth)
  /user/avatar:
    delete:
      consumes:
      - application/json
      description: 将当前登录用户的头像字段清空为默认状态
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 移除当前用户头像
      tags:
      - 用户 (User)
    post:
      consumes:
      - multipart/form-data
      description: 接收前端传来的图片文件，保存到本地并更新数据库中的头像 URL
      parameters:
      - description: 头像图片文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 上传用户头像
      tags:
      - 用户 (User)
  /user/password:
    put:
      consumes:
      - application/json
      description: 验证旧密码并更新为新密码，更新后需要重新登录
      parameters:
      - description: 修改密码的参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - 用户 (User)
  /user/username:
    put:
      consumes:
      - application/json
      description: 修改用户名后，JWT 令牌会失效，前端需要强制重新登录
      parameters:
      - description: 修改用户名的参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 修改当前用户名
      tags:
      - 用户 (User)
  /users:
    get:
      consumes:
      - application/json
      description: 在用户管理表格中展示所有用户
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户 (User)
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: 管理员在后台删除指定用户，超级管理员(admin)不能被删除
      parameters:
      - description: 要删除的用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户 (User)
swagger: "2.0"
